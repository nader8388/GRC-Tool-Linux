version: '3.8'

services:
  grc:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"      # Change left side to use a different host port e.g. "8080:3000"
    volumes:
      - grc_data:/app/data          # SQLite database — persists across container restarts
      - grc_uploads:/app/uploads    # File attachments — persists across container restarts
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change_this_secret_in_production}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  grc_data:
  grc_uploads:
